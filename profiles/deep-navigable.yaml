version: 1
name: deep-navigable
description: 情報を削らず、要点と詳細を階層化する
answer_position: executive_summary_first
detail_delivery: full_with_navigation
parenthetical_policy: integrate_separate_or_endnote
literal_language: prefer
explicit_referents: when_ambiguous
term_consistency: strict
sentence_soft_max_chars: 65
sentence_hard_review_chars: 100
paragraph_max_sentences: 4
parallel_list_threshold: 3
list_chunk_soft_max_items: 7
require_descriptive_headings: true
preserve_technical_terms: true
preserve_uncertainty: true
preserve_critical_details: true
